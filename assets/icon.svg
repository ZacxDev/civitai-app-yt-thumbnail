      <stop offset="0" stop-color="#3b9bf0"/>
      <stop offset="1" stop-color="#12508f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2028"/>
      <stop offset="1" stop-color="#0d0f13"/>
