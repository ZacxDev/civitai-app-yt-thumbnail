<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141821"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#1971c2" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#1971c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shotA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7fd0"/>
      <stop offset="0.55" stop-color="#3f4bb0"/>
      <stop offset="1" stop-color="#7b3f9e"/>
    </linearGradient>
    <linearGradient id="shotB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6fae"/>
      <stop offset="1" stop-color="#153a72"/>
    </linearGradient>
    <linearGradient id="shotC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a4bbe"/>
      <stop offset="1" stop-color="#37307e"/>
    </linearGradient>
    <linearGradient id="shotD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2632f"/>
      <stop offset="1" stop-color="#6d2a4a"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.62"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#page)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- ===== left column ===== -->
  <g font-family="Noto Sans, DejaVu Sans, sans-serif">
    <text x="96" y="268" fill="#4dabf7" font-size="26" font-weight="700" letter-spacing="6">CIVITAI APP</text>

    <text x="96" y="388" fill="#ffffff" font-size="104" font-weight="800" letter-spacing="-2">YT Thumbnail</text>

    <text x="96" y="452" fill="#98a2b3" font-size="34" font-weight="400">Generate 1280×720 YouTube thumbnails,</text>
    <text x="96" y="500" fill="#98a2b3" font-size="34" font-weight="400">remix your own image, then overlay the text.</text>

    <!-- feature pills -->
    <g font-size="24" font-weight="600">
      <rect x="96"  y="560" width="206" height="56" rx="28" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="199" y="596" fill="#dbe2ea" text-anchor="middle">16:9 locked</text>

      <rect x="318" y="560" width="234" height="56" rx="28" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="435" y="596" fill="#dbe2ea" text-anchor="middle">img2img remix</text>

      <rect x="568" y="560" width="206" height="56" rx="28" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="671" y="596" fill="#dbe2ea" text-anchor="middle">2 MB export</text>
    </g>
  </g>

  <!-- ===== right: hero thumbnail ===== -->
  <g>
    <rect x="852" y="172" width="656" height="369" rx="22" fill="url(#shotA)"/>
    <rect x="852" y="172" width="656" height="369" rx="22" fill="url(#scrim)"/>
    <rect x="852" y="172" width="656" height="369" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

    <!-- play -->
    <circle cx="1180" cy="330" r="58" fill="#000000" fill-opacity="0.35"/>
    <path d="M1160 300 L1160 360 L1213 330 Z" fill="#ffffff"/>

    <!-- caption overlay, the editor's output -->
    <g font-family="Noto Sans, DejaVu Sans, sans-serif">
      <text x="896" y="492" fill="#ffd43b" font-size="56" font-weight="800" letter-spacing="1">TOP 10 AI TOOLS</text>
    </g>

    <!-- 1280x720 badge -->
    <rect x="1330" y="196" width="154" height="44" rx="12" fill="#000000" fill-opacity="0.45"/>
    <text x="1407" y="226" fill="#ffffff" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="22" font-weight="600" text-anchor="middle">1280×720</text>
  </g>

  <!-- ===== right: candidate strip ===== -->
  <g>
    <rect x="852" y="573" width="205" height="115" rx="12" fill="url(#shotB)"/>
    <rect x="852" y="573" width="205" height="115" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <rect x="1077" y="573" width="205" height="115" rx="12" fill="url(#shotC)"/>
    <rect x="1077" y="573" width="205" height="115" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <rect x="1303" y="573" width="205" height="115" rx="12" fill="url(#shotD)"/>
    <rect x="1303" y="573" width="205" height="115" rx="12" fill="none" stroke="#4dabf7" stroke-opacity="0.9" stroke-width="3"/>
  </g>
</svg>
