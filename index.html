<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dark first, deliberately: `light dark` would default the UA canvas to
         LIGHT and flash white before any theme hint arrives. -->
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231971c2'/></svg>" />
    <title>YT Thumbnail — Civitai App</title>
    <!-- BOOT SKELETON. Paired with `"bootSkeleton": true` in
         block.manifest.json, so this document IS the loading state a viewer
         sees. Inline and JS-free on purpose.

         Every hex and every width below is a second copy of a value
         src/palette.ts and src/layout.ts own. src/boot-skeleton.test.ts parses
         this <style> block, fails on any drift, and carries the reasoning —
         read it there rather than here. -->
    <style>
      html {
        /* palette.dark.page */
        background: #0b0e14;
      }
      body {
        margin: 0;
      }
      /* Mirrors `shellStyle` in src/App.tsx, including its `SHELL_PADDING`. */
      [data-boot-skeleton] {
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 24px;
        box-sizing: border-box;
      }
      /* Attribute selectors, not classes: a class is fair game for a purge or
         hashing pass, an attribute survives the bundler.

         The cap is `layoutForTier`'s one-column rung. palette.dark.surface +
         .border. */
      [data-boot-skeleton] [data-boot-shape='card'] {
        width: 100%;
        max-width: 640px;
        padding: 24px;
        border-radius: 8px;
        background: #14181f;
        border: 1px solid #2a313d;
        box-sizing: border-box;
      }
      /* Controls inside a panel take the token a control inside a panel takes:
         palette.dark.surfaceRaised. */
      [data-boot-skeleton] [data-boot-shape='card'] > [data-boot-shape] {
        background: #1c222b;
        border-radius: 6px;
        margin-bottom: 16px;
      }
      [data-boot-skeleton] [data-boot-shape='title'] {
        height: 24px;
        width: 45%;
      }
      [data-boot-skeleton] [data-boot-shape='control'] {
        height: 34px;
      }
      [data-boot-skeleton] [data-boot-shape='field'] {
        height: 96px;
      }
      [data-boot-skeleton] [data-boot-shape='button'] {
        height: 36px;
        margin-bottom: 0;
      }
      /* 🔴 THE TWO RUNGS ARE OFFSET BY THE SHELL'S OWN PADDING, AND THE OFFSET
         IS THE POINT. These are VIEWPORT queries; the app switches tier on the
         CONTENT box of the padded shell, i.e. the viewport less 2 x 24px. So
         the viewport width at which the app reaches `sm` is 768 + 48 = 816,
         and `xl` is 1440 + 48 = 1488. Using the raw breakpoints made the boot
         card 752px at an 800px viewport where the app settles at 640px.
         src/boot-skeleton.test.ts derives both numbers from `resolveBlockTier`
         and sweeps the two ladders for equality.
         🔴 THE SECOND RUNG MOVED FROM 1232 TO 1488 WITH THE RAIL. `lg` used to
         be the first UNCAPPED tier; it is a two-column tier now and keeps the
         1184 cap (see TWO_COLUMN_MAX_WIDTH), so the cap drops at `xl` instead.
         A 1232 rung here would make the boot card 1184px wider than the settled
         column at every viewport from 1232 to 1487 — the exact class of
         mount-time width jump the sweep exists to catch. */
      @media (min-width: 816px) {
        [data-boot-skeleton] [data-boot-shape='card'] {
          max-width: 1184px;
        }
      }
      /* Uncapped from here, because `layoutForTier('xl').maxWidth` is null. The
         skeleton draws no rail: three columns of placeholders would promise a
         layout the app might not land on. */
      @media (min-width: 1488px) {
        [data-boot-skeleton] [data-boot-shape='card'] {
          max-width: none;
        }
      }
      @media (prefers-color-scheme: light) {
        html {
          /* palette.light.page */
          background: #f7f9fc;
        }
        [data-boot-skeleton] [data-boot-shape='card'] {
          /* palette.light.surface + .border */
          background: #ffffff;
          border-color: #d2d9e4;
        }
        [data-boot-skeleton] [data-boot-shape='card'] > [data-boot-shape] {
          /* palette.light.surfaceRaised */
          background: #edf0f6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- MUST live inside #root: React's `createRoot(container).render()`
           clears the container's children on first commit, which is the only
           reason no removal code is needed. A skeleton painted as a SIBLING of
           #root, or mounted by a framework that APPENDS, stays on screen.
           aria-hidden because the host already publishes `aria-busy`. -->
      <div data-boot-skeleton aria-hidden="true">
        <div data-boot-shape="card">
          <div data-boot-shape="title"></div>
          <div data-boot-shape="control"></div>
          <div data-boot-shape="field"></div>
          <div data-boot-shape="button"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
