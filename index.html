<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- DARK FIRST, deliberately. The first thing an iframe paints is the UA
         canvas, and the host sends this block no theme hint before it boots, so
         the boot theme is a GUESS and the platform's guess is dark. `light dark`
         here would default the canvas to LIGHT and flash white. -->
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231971c2'/></svg>" />
    <title>YT Thumbnail — Civitai App</title>
    <!-- BOOT SKELETON styles. Paired with `"bootSkeleton": true` in
         block.manifest.json — THE TWO CANNOT BE SEPARATED. When the manifest
         declares bootSkeleton the Civitai run host stands down its own loading
         veil (no branded overlay, iframe opaque from mount, no reveal settle),
         so whatever this document paints IS the loading state. Declare the flag
         over an empty #root and the viewer stares at a blank iframe for the
         whole load — strictly worse than not opting in.

         INLINE, and no JS: an external stylesheet is a second round-trip, which
         is exactly the window this exists to cover. These rules must paint
         before anything is fetched — including before the W6 pack's stylesheet,
         so the literal colours below are stand-ins for the pack's surface /
         border tokens rather than `var(--civitai-color-*)` reads, which resolve
         to nothing this early.

         DARK IS THE BASE. Light lives in a `prefers-color-scheme: light` block
         and nowhere else. There is deliberately NO `prefers-color-scheme: dark`
         block: a UA reporting `no-preference`, or one that does not support the
         query at all, matches neither branch and would fall through to whatever
         the base rules say — so the base rules have to be the dark ones.

         🔴 EVERY HEX AND EVERY WIDTH BELOW IS A SECOND COPY OF A VALUE THIS APP
         OWNS IN TYPESCRIPT, AND THAT IS THE HAZARD, NOT THE FIX. This document
         is static: it cannot import `src/palette.ts` or call `layoutForTier`,
         so mirroring them here duplicates them. A silently-drifting duplicate
         is worse than the mismatch it replaces — so
         `src/boot-skeleton.test.ts` parses THIS `<style>` block and fails when
         any value here disagrees with its source, including when a hex appears
         here that no palette token accounts for. Change a value in
         `palette.ts` or `layout.ts` and that test tells you to change it here.

         🔴 WHY IT HAD TO CHANGE. `block.manifest.json` declares
         `"bootSkeleton": true`, so the host stands down its own veil and this
         document IS the loading state. It previously painted the pack's old
         greys (#101113 / #1a1b1e / #2c2e33) at a 640px cap, which agreed with
         the app only while the app was also 640px of host greys. Once the app
         became a full-width `page`-grounded layout with a rail, the boot state
         jumped BOTH colour and width at mount on the full-page surface — a
         640px dark-grey card on near-black snapping to a full-width #0B0E14
         page — which is exactly the surface the layout pass exists to improve.

         🔴 A MEDIA QUERY IS LEGITIMATE HERE, WHERE A CONTAINER QUERY IS NOT.
         `layout.ts` explains why the app cannot use a container query (a query
         prelude cannot read `--civitai-bp-*`). The cap ladder below is a
         VIEWPORT media query instead, and inside the block's sandboxed iframe
         the viewport IS the box the app measures: `useBlockBreakpoint` observes
         `document.documentElement`, which its own docs state "inside the
         sandbox IS the slot the host handed us". So the skeleton and the app
         change shape at the same widths rather than at two different ones. -->
    <style>
      html {
        /* The strong guarantee. Unlike `color-scheme` this does not depend on
           UA support for anything. `palette.dark.page`. */
        background: #0b0e14;
      }
      body {
        margin: 0;
      }
      /* Mirrors `shellStyle` in src/App.tsx, including its `SHELL_PADDING`. */
      [data-boot-skeleton] {
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 24px;
        box-sizing: border-box;
      }
      /* Attribute selectors, not classes: a class is fair game for CSS-modules
         hashing or a purge pass, an attribute survives the bundler.

         The cap is `layoutForTier`'s one-column rung; the two media queries
         below are its other two. `palette.dark.surface` + `.border`. */
      [data-boot-skeleton] [data-boot-shape='card'] {
        width: 100%;
        max-width: 640px;
        padding: 24px;
        border-radius: 8px;
        background: #14181f;
        border: 1px solid #2a313d;
        box-sizing: border-box;
      }
      /* The shimmer blocks stand in for controls inside the panel, so they take
         the token a control inside a panel takes: `palette.dark.surfaceRaised`. */
      [data-boot-skeleton] [data-boot-shape='card'] > [data-boot-shape] {
        background: #1c222b;
        border-radius: 6px;
        margin-bottom: 16px;
      }
      [data-boot-skeleton] [data-boot-shape='title'] {
        height: 24px;
        width: 45%;
      }
      [data-boot-skeleton] [data-boot-shape='control'] {
        height: 34px;
      }
      [data-boot-skeleton] [data-boot-shape='field'] {
        height: 96px;
      }
      [data-boot-skeleton] [data-boot-shape='button'] {
        height: 36px;
        margin-bottom: 0;
      }
      /* The two-column rung: `breakpoints.sm` (768), cap
         `layoutForTier('sm').maxWidth` (1184). */
      @media (min-width: 768px) {
        [data-boot-skeleton] [data-boot-shape='card'] {
          max-width: 1184px;
        }
      }
      /* The rail rung: `breakpoints.lg` (1184), where
         `layoutForTier('lg').maxWidth` is null — the block fills its width, so
         the boot card does too. The skeleton does NOT draw a rail: two columns
         of placeholder shapes would promise a layout the app might not land on
         (the rail needs `lg` measured on the app's own box, not the viewport),
         and an uncapped card is the width claim the two surfaces do share. */
      @media (min-width: 1184px) {
        [data-boot-skeleton] [data-boot-shape='card'] {
          max-width: none;
        }
      }
      @media (prefers-color-scheme: light) {
        html {
          /* `palette.light.page`. */
          background: #f7f9fc;
        }
        [data-boot-skeleton] [data-boot-shape='card'] {
          /* `palette.light.surface` + `.border`. */
          background: #ffffff;
          border-color: #d2d9e4;
        }
        [data-boot-skeleton] [data-boot-shape='card'] > [data-boot-shape] {
          /* `palette.light.surfaceRaised`. */
          background: #edf0f6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- The skeleton MUST live inside #root. One painted as a sibling of the
           mount container is never replaced by the app's render and stays on
           screen after mount.

           NO REMOVAL CODE IS NEEDED HERE, AND THAT IS REACT-SPECIFIC.
           `createRoot(container).render(...)` in src/main.tsx clears the
           container's existing children before its first commit, so this
           skeleton removes itself. A framework that APPENDS instead of clearing
           (Svelte 5's `mount(App, { target })`, for one) leaves it on screen
           and needs an explicit
           `document.querySelector('[data-boot-skeleton]')?.remove()` straight
           after the mount call. Assume APPEND for anything you have not
           measured.

           aria-hidden because this is decoration: the host already publishes
           `aria-busy` on the iframe while the block is loading, and a second
           announcement in here would just talk over it. -->
      <div data-boot-skeleton aria-hidden="true">
        <div data-boot-shape="card">
          <div data-boot-shape="title"></div>
          <div data-boot-shape="control"></div>
          <div data-boot-shape="field"></div>
          <div data-boot-shape="button"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
